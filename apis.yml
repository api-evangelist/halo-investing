aid: halo-investing
name: Halo Investing
description: 'Halo Investing is a Chicago-based financial technology company that operates
  a marketplace for "protective investments" — structured notes, multi-manager structured
  note SMAs, buffered ETFs, annuities and insurance — connecting financial advisors,
  RIAs and financial institutions with more than 40 global banking and insurance issuers.
  Founded in 2015 by Biju Kulathakal and Jason Barsema, the platform lets advisors
  analyze, customize, price, execute and then monitor outcome-based products from a
  single dashboard, with tools such as the Aura portfolio simulator and an asset allocation
  framework for structured notes. Halo reports more than $45.5B in transactions since
  2015 and employs 100+ people. Its affiliate Halo Securities LLC is an SEC-registered
  broker-dealer and a member of FINRA/SIPC, acting as distributor and selling agent
  for structured note products. The advisor platform at notes.haloinvesting.com is
  entirely authenticated behind a login. As of this profiling pass Halo Investing publishes
  no public developer portal, API documentation, OpenAPI/AsyncAPI/GraphQL contract,
  SDK, CLI, MCP server or A2A agent card; advisor-side API integration is offered through
  the third-party Schwab OpenView Gateway rather than a Halo-published API.'
